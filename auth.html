<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="description" content="Wimpy Books — Preview, read and unlock digital books. Nigeria's growing digital library.">
<meta property="og:title" content="Wimpy Books">
<meta property="og:description" content="Preview, read and unlock digital books.">
<meta property="og:url" content="https://wimpybooks.netlify.app">
<meta property="og:type" content="website">
<meta name="theme-color" content="#d4af37">
<title>Login / Sign Up — Wimpy Books</title>
<script>
  (function () {
    var saved = localStorage.getItem('wimpybooks-theme');
    var theme = saved === 'light' || saved === 'dark' ? saved : 'dark';
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="one">
    <a class="nav-logo" href="index.html" aria-label="Wimpy Books home">
      <img src="logo.svg" alt="Wimpy Books logo" width="40" height="40">
      <span>Wimpy Books</span>
    </a>
    <a href="store.html">📚 Store</a>
    <a href="upload.html">⬆️ Upload</a>
    <a href="contacts.html">📞 Contacts</a>
    <a href="auth.html" id="navAuth" class="nav-auth active">🔐 Login</a>
    <button class="theme-toggle" id="themeToggle" type="button">🌙</button>
  </nav>

  <section class="auth-wrapper">
    <div class="auth-card">
      <div class="info-box">
        <h3>🔐 WimpyID sign-in</h3>
        <p>WimpyBooks now uses WimpyID for authentication. Continue to the secure sign-in page to access your library.</p>
      </div>
      <div class="auth-actions">
        <a href="https://id.wimpy-corp.com.ng/login?redirect=https://wimpybooks.netlify.app/index.html" class="btn-primary btn-full">Continue with WimpyID</a>
      </div>
    </div>
  </section>

  <footer class="leg">
    <p>© 2026 Wimpy Books — A Wimpy Co-operations product</p>
  </footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="config.js"></script>
<script src="auth.js"></script>
<script>
  if (window.location.search.includes('redirect=')) {
    const redirect = new URLSearchParams(window.location.search).get('redirect');
    if (redirect) {
      window.location.href = redirect;
    }
  }
</script>

</body>
</html>
